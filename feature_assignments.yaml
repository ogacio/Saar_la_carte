# Structured feature assignment file for the implementation plan and implementation report submissions.
# Keep this file in the repository root.
#
# HOW TO EDIT THIS FILE
#   1. `implementation_responsible` comes from the split the group agreed on: everyone implements
#      the part of the design they worked on themselves.
#   2. `testing_responsible` is assigned in blocks, not per feature. Every member tests the whole
#      output of two other members instead of single features scattered across the system, so the
#      tester only has to learn one coherent slice of the design at a time:
#         Ognjen's features       -> Teodor, Stefan
#         Teodor's features       -> Stefan, Biborka
#         Stefan's features       -> Biborka, Constantin
#         Biborka's features      -> Constantin, Ognjen
#         Constantin's features   -> Ognjen, Teodor
#   3. `note` is optional free text for workload/dependency rationale. The feature name from
#      Table 1 of the project specification (p. 41) is kept as a comment on each entry.
#
# Rules the file must keep satisfying:
#   - exactly one implementation_responsible per feature
#   - exactly two testing_responsible per feature, never the implementer
#   - for F01-F07, every member is implementation_responsible for 1-2 features
group:
  name: Group 17
  members:
    # Use your GitLab user names as identifiers
    - gitlab_user: ogacio
      name: Ognjen Stojicic
    - gitlab_user: Teodor.Vasilev
      name: Teodor Vasilev
    - gitlab_user: stma00002
      name: Stefan Marinkov
    - gitlab_user: fancsaliborka
      name: Biborka Timea Fancsali
    - gitlab_user: op23no5
      name: Constantin Hartmann

